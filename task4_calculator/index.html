<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Калькулятор</h1>
        
        <div class="input-group">
            <input type="text" id="num1" class="input-field" placeholder="Число 1">
            <input type="text" id="num2" class="input-field" placeholder="Число 2">
        </div>
        
        <div class="button-group">
            <button class="btn btn-sum" data-operation="sum">➕</button>
            <button class="btn btn-sub" data-operation="sub">➖</button>
            <button class="btn btn-mul" data-operation="mul">✖️</button>
            <button class="btn btn-div" data-operation="div">➗</button>
        </div>
        
        <div class="result-display" id="resultDisplay">0</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
